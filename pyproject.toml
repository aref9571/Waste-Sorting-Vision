[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "waste-sorting-vision"
version = "0.1.0.dev0"
description = "Image classification service that sorts photographed household waste into recycling categories."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "aref" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "onnxruntime>=1.19",
    "numpy>=2.0",
    "pillow>=10.4",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "typer>=0.12",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "torchvision>=0.19",
    "scikit-learn>=1.5",
    "scikit-image>=0.24",
    "matplotlib>=3.9",
    "onnx>=1.16",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
wastevision = "wastevision.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wastevision"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "C4", "PT", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["wastevision"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
